name: smoke-m3

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'versions/**'
      - 'scripts/smoke/**'
      - 'examples/**'
      - 'Makefile'
      - '.github/workflows/smoke-m3.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'versions/**'
      - 'scripts/smoke/**'
      - 'examples/**'
      - 'Makefile'
      - '.github/workflows/smoke-m3.yml'
  schedule:
    - cron: '0 3 * * 1'

jobs:
  m3-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout hi-im-core for hub build
        uses: actions/checkout@v4
        with:
          repository: sunchao1/hi-im-core
          path: hi-im-core
          ref: main

      - name: Set hub build context
        run: echo "HIIM_HUB_BUILD_CONTEXT=${{ github.workspace }}/hi-im-core" >> deploy/compose/.env

      - name: M3 smoke
        run: make m3-smoke
