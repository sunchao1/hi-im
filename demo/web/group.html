<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hi-im 群聊演示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>hi-im 群聊演示 (M6)</h1>
    <p class="hint">
      开两个浏览器窗口：<strong>窗口 A</strong> uid=<code>100001</code> gateway=<code id="gwA"></code>；
      <strong>窗口 B</strong> uid=<code>100002</code> gateway=<code id="gwB"></code>。
      A 建群后 B 在 GID 栏填入同一数字再点「加入群」（也可 <code>?gw=2&amp;gid=1</code>）。
      <strong>须先点「注册并连接」，日志出现 ONLINE ok 后再操作。</strong>
    </p>
    <section class="panel">
      <label>Gateway WS <input id="wsUrl" type="text" size="40"></label>
      <label>UID <input id="uid" type="number" value="100001"></label>
      <button id="goBtn">注册并连接</button>
      <span id="status">idle</span>
    </section>
    <section class="panel">
      <label>群名 <input id="groupName" type="text" value="demo-group"></label>
      <button id="creatBtn" type="button" class="btn-disabled" aria-disabled="true">创建群</button>
      <label>GID <input id="gid" type="number" min="1" placeholder="A 建群后的 gid"></label>
      <button id="joinBtn" type="button" class="btn-disabled" aria-disabled="true">加入群</button>
    </section>
    <section class="panel">
      <input id="chatBox" type="text" placeholder="输入群消息..." disabled>
      <button id="sendBtn" disabled>发送</button>
    </section>
    <section id="log"></section>
  </main>
  <script src="demo-common.js?v=20260703i"></script>
  <script src="pb.js?v=20260703i"></script>
  <script src="group-app.js?v=20260703i"></script>
</body>
</html>
