<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hi-im 群聊演示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>hi-im 群聊演示 (M6)</h1>
    <p class="hint">
      开两个浏览器窗口：<strong>窗口 A</strong> uid=<code>100001</code> gateway=<code id="gwA"></code>；
      <strong>窗口 B</strong> uid=<code>100002</code> gateway=<code id="gwB"></code>。
      A 建群后 B 用同一 gid 加群，即可互发消息。
    </p>
    <section class="panel">
      <label>Gateway WS <input id="wsUrl" type="text" size="40"></label>
      <label>UID <input id="uid" type="number" value="100001"></label>
      <button id="goBtn">注册并连接</button>
      <span id="status">idle</span>
    </section>
    <section class="panel">
      <label>群名 <input id="groupName" type="text" value="demo-group"></label>
      <button id="creatBtn" disabled>创建群</button>
      <label>GID <input id="gid" type="number" value="0"></label>
      <button id="joinBtn" disabled>加入群</button>
    </section>
    <section class="panel">
      <input id="chatBox" type="text" placeholder="输入群消息..." disabled>
      <button id="sendBtn" disabled>发送</button>
    </section>
    <section id="log"></section>
  </main>
  <script src="demo-common.js"></script>
  <script src="pb.js"></script>
  <script src="group-app.js"></script>
</body>
</html>
